name: Update vulnerable npm lockfile
on:
  push:
    branches:
      - security/harden-arithmetic-api-20261103
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/security/harden-arithmetic-api-20261103'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update vulnerable packages within compatible ranges
        run: npm audit fix
      - name: Validate reproducible install
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Verify audit
        run: npm audit --audit-level=moderate
      - name: Commit corrected lockfile to review branch
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "security: update vulnerable npm dependencies"
            git push origin HEAD:security/harden-arithmetic-api-20261103
          fi
